name: Frontend CI

on:
  pull_request:
    branches: [main]
  # Kiem tra lai ket qua gop sau merge va day image len Docker Hub
  push:
    branches: [main]

permissions:
  contents: read

# Push commit moi len PR thi huy run cu dang chay; run tren main thi de chay het
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: '0'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  # Dam bao image production build duoc va chay duoc. Chi push khi merge vao main
  # va repo da khai bao secret Docker Hub.
  docker:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLISH: >-
        ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME != ''
        && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: docker compose config --quiet

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: interviewiq-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run -d --name web -p 8080:80 interviewiq-frontend:ci
          # Trang chu va mot route phia client deu phai tra ve index.html
          for path in / /history; do
            curl --fail --silent --retry 10 --retry-delay 1 --retry-all-errors \
              "http://localhost:8080$path" | grep -q 'id="root"'
          done

      - name: Show container logs on failure
        if: failure()
        run: docker logs web || true

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        if: env.PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/interviewiq-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # VITE_* nhung vao bundle luc build: image publish dung bien cua repo.
      - name: Publish image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:3000/api' }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME || 'InterviewIQ' }}
          cache-from: type=gha
